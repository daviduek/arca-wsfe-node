name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 quedo fuera: undici 8 exige >= 22.19 (usa descompresion zstd)
        # y Node 20 llego a fin de soporte en abril de 2026.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Sin red: WSFE esta mockeado, no se consulta ARCA.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
